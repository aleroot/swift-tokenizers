name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (${{ matrix.os }}, Swift 6)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        if: matrix.os == 'macos-15'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Toolchain and runtime
        run: |
          swift --version
          sw_vers

      - name: Cache tokenizer fixtures
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/swift-tokenizers-tests
          key: fixtures-${{ hashFiles('Tests/TokenizersTests/Support/HubFixtures.swift') }}

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: swift test --parallel

      - name: Test optimized code
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TOKENIZERS_PARITY_REPORT_DIR: ${{ runner.temp }}/tokenizers-parity
        run: swift test -c release --parallel -Xswiftc -warnings-as-errors

      - name: Summarize reference parity
        run: python3 scripts/parity_report.py "$RUNNER_TEMP/tokenizers-parity" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reference parity report
        uses: actions/upload-artifact@v4
        with:
          name: reference-parity-${{ matrix.os }}
          path: ${{ runner.temp }}/tokenizers-parity/summary.json
          if-no-files-found: error

      - name: Official Unicode normalization conformance
        env:
          UNICODE_CONFORMANCE_FILE: ${{ runner.temp }}/NormalizationTest.txt
        run: |
          curl --fail --location --retry 3 \
            https://www.unicode.org/Public/9.0.0/ucd/NormalizationTest.txt \
            --output "$UNICODE_CONFORMANCE_FILE"
          test "$(shasum -a 256 "$UNICODE_CONFORMANCE_FILE" | cut -d ' ' -f 1)" = \
            2d48d848656b3cf889df59980ab13551988950c4ca8c5190a17c691a17f8b9bb
          swift test -c release --skip-build --filter UnicodeConformanceTests

      - name: Thread sanitizer (concurrency suites)
        run: swift test --sanitize=thread --filter "TokenizerLifetime|Concurrency|Differential|OptimizationRegression|UnicodeTablesTests|SendableTests|BPEMerge|PieceDecoder|TokenStreamDecoder"

      - name: Address sanitizer (byte kernels and raw storage)
        run: swift test --sanitize=address --filter "TokenizerLifetime|ByteKernels|OptimizationRegression|ConfigTests|TrieTests|UnicodeTablesTests|UnicodeNormalizationTests|CorrectnessAuditTests|JSONFuzz|BPEMerge|PieceDecoder|TokenStreamDecoder|TokenizationCleanup"

  docs:
    name: Documentation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      # The DocC plugin is appended to the checkout instead of the manifest, so that it never
      # appears in the dependency graph of an app. Same approach as swiftlang/github-workflows.
      - name: Check the DocC catalog (warnings are errors)
        run: |
          printf '\npackage.dependencies.append(\n    .package(url: "https://github.com/swiftlang/swift-docc-plugin", from: "1.0.0")\n)\n' >> Package.swift
          swift package plugin generate-documentation --target Tokenizers --warnings-as-errors --analyze

  ios:
    name: Build (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Cross-compile for the iOS 16 simulator (deployment floor)
        run: |
          swift build --target Tokenizers \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            --triple arm64-apple-ios16.0-simulator \
            -Xswiftc -warnings-as-errors
