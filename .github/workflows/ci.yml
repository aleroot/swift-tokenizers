name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (macOS, Swift 6)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Cache tokenizer fixtures
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/swift-tokenizers-tests
          key: fixtures-${{ hashFiles('Tests/TokenizersTests/Support/HubFixtures.swift') }}

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: swift test --parallel

      - name: Thread sanitizer (concurrency suites)
        run: swift test --sanitize=thread --filter "Concurrency|Differential"

  ios:
    name: Build (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Cross-compile for the iOS 16 simulator (deployment floor)
        run: |
          swift build --target Tokenizers \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            --triple arm64-apple-ios16.0-simulator \
            -Xswiftc -warnings-as-errors
